}

.logo{

.menu-toggle{

}

}

.cover-card:before{
  content:"";
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  background:rgba(121,76,255,.20);
  filter:blur(75px);
  top:-130px;
  left:-100px;
}

.cover-card:after{
  content:"";
  position:absolute;
  width:230px;
  height:230px;
  border-radius:50%;
  background:rgba(47,121,255,.13);
  filter:blur(70px);
  right:-100px;
  bottom:-120px;
}

.cover-content{
  position:relative;
  z-index:2;
}

.cover-small{
  color:#9c91ff;
  font-size:11px;
  font-weight:800;
  letter-spacing:3px;
  margin-bottom:20px;
}

  letter-spacing:-3px;

.cover-subtitle{

  color:#d7d4e1;
  font-size:17px;
  font-weight:600;
}

.cover-author{

}

  font-weight:800;

  box-shadow:0 12px 30px rgba(89,82,255,.28);
}

.start-btn:active{

.thought-box{

  font-size:11px;
  font-weight:700;

.reader-controls{

.reader-controls button{

  .page-title{

  .progress{

  .story{

  }

</style>

/* =========================================================
   BOOK ENGINE
   ========================================================= */

var currentPage = 0;
var currentLanguage = "english";

var cover = document.getElementById("cover");
var reader = document.getElementById("reader");

var startReading = document.getElementById("startReading");
var story = document.getElementById("story");
var thought = document.getElementById("thought");

var chapterLabel = document.getElementById("chapterLabel");
var pageTitle = document.getElementById("pageTitle");
var progress = document.getElementById("progress");
var pageSection = document.getElementById("pageSection");
var pageNumber = document.getElementById("pageNumber");

var englishBtn = document.getElementById("englishBtn");
var hinglishBtn = document.getElementById("hinglishBtn");

var prevButton = document.getElementById("prevButton");
var nextButton = document.getElementById("nextButton");


function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showReader(){

  cover.style.display="none";
  reader.style.display="block";

  currentPage=0;

  renderPage();

  window.scrollTo(0,0);

}


function renderPage(){

  if(!pages[currentPage]){
    return;
  }

  var item=pages[currentPage];

  var languageData;
  var highlightData;
  var thoughtData;

  if(currentLanguage==="hinglish"){

    languageData=item.hinglish;
    highlightData=item.highlightHinglish;
    thoughtData=item.thoughtHinglish;

  }else{

    languageData=item.english;
    highlightData=item.highlightEnglish;
    thoughtData=item.thoughtEnglish;

  }


  chapterLabel.innerHTML=escapeHTML(item.chapter);

  pageTitle.innerHTML=escapeHTML(item.title);

  progress.innerHTML="Page "+item.page+" / "+pages.length;

  pageSection.innerHTML=escapeHTML(item.chapter);

  pageNumber.innerHTML="Page "+item.page;


  var html="";
  var i;

  for(i=0;i<languageData.length;i++){

    html += "<p>"+escapeHTML(languageData[i])+"</p>";

  }


  if(highlightData){

    html += "<div class='story-highlight'>"+
      escapeHTML(highlightData)+
      "</div>";

  }


  story.innerHTML=html;

  thought.innerHTML=escapeHTML(thoughtData);


  if(currentPage===0){

    prevButton.disabled=true;

  }else{

    prevButton.disabled=false;

  }


  if(currentPage===pages.length-1){

    nextButton.innerHTML="Finish";

  }else{

    nextButton.innerHTML="Next →";

  }


  window.scrollTo(0,0);

}


function setLanguage(language){

  currentLanguage=language;

  if(language==="hinglish"){

    hinglishBtn.className="lang-btn active";
    englishBtn.className="lang-btn";

  }else{

    englishBtn.className="lang-btn active";
    hinglishBtn.className="lang-btn";

  }

  renderPage();

}


function nextPage(){

  if(currentPage < pages.length-1){

    currentPage++;

    renderPage();

  }else{

    renderFinalScreen();

  }

}


function previousPage(){

  if(currentPage>0){

    currentPage--;

    renderPage();

  }

}


function renderFinalScreen(){

  var finalTitle;
  var finalText;

  if(currentLanguage==="hinglish"){

    finalTitle="The End";
    finalText="Kuch summers end ho jaati hain. Kuch summers humare andar hamesha reh jaati hain.";

  }else{

    finalTitle="The End";
    finalText="Some summers end. Some summers stay forever.";

  }


  story.innerHTML=
    "<div class='end-screen'>"+
    "<h2>"+escapeHTML(finalTitle)+"</h2>"+
    "<p>"+escapeHTML(finalText)+"</p>"+
    "</div>";

  thought.innerHTML=
    currentLanguage==="hinglish"
    ?
    "Jo memories humare andar kuch badal deti hain, unka end kabhi completely nahi hota."
    :
    "The memories that change us never truly have an ending.";

  nextButton.innerHTML="Read Again";

  nextButton.onclick=function(){

    currentPage=0;
    renderPage();

  };

  prevButton.disabled=false;

  window.scrollTo(0,0);

}


/* BUTTONS */

startReading.onclick=function(e){

  e.preventDefault();

  showReader();

};


englishBtn.onclick=function(){

  setLanguage("english");

};


hinglishBtn.onclick=function(){

  setLanguage("hinglish");

};


prevButton.onclick=function(){

  previousPage();

};


nextButton.onclick=function(){

  nextPage();

};


/* =========================================================
   MOBILE MENU
   ========================================================= */

(function(){

  var button=document.getElementById("menuButton");
  var menu=document.getElementById("navMenu");

  if(!button || !menu){
    return;
  }

  button.onclick=function(event){

    event.preventDefault();
    event.stopPropagation();

    if(menu.classList.contains("open")){

      menu.classList.remove("open");

    }else{

      menu.classList.add("open");

    }

  };


  var links=menu.getElementsByTagName("a");
  var i;

  for(i=0;i<links.length;i++){

    links[i].onclick=function(){

      menu.classList.remove("open");

    };

  }

})();

</script>
